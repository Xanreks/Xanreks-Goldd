<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Xanreks Gold</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#07030f; --card:#120a24; --card2:#1a0f33; --line:#2c1b52;
  --p:#a855f7; --p2:#d946ef; --txt:#f5eefe; --mut:#9b8bb8; --gold:#ffd166;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;padding:16px 16px 110px;
  background:
   radial-gradient(600px 300px at 0% 100%,rgba(217,70,239,.28),transparent 70%),
   radial-gradient(600px 300px at 100% 100%,rgba(124,58,237,.30),transparent 70%),
   radial-gradient(500px 260px at 50% -10%,rgba(168,85,247,.22),transparent 70%),var(--bg)}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 18px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:900;
  letter-spacing:-1px;background:linear-gradient(145deg,#2a1558,#12082a);
  border:1px solid var(--line);box-shadow:0 0 18px rgba(168,85,247,.55);
  text-shadow:0 0 12px #c084fc}
.brand b{font-size:15px;letter-spacing:3px;text-transform:uppercase}
.bal{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;
  font-weight:700;color:var(--gold);box-shadow:0 0 16px rgba(255,209,102,.12)}
h1{font-size:34px;line-height:1.05;margin:6px 0 18px;letter-spacing:-1px}
h1 span{color:#8b7aa8}
.grid{display:grid;gap:12px}
.case{position:relative;background:linear-gradient(160deg,var(--card2),var(--card));
  border:1px solid var(--line);border-radius:22px;padding:18px;overflow:hidden;cursor:pointer;
  transition:transform .15s,border-color .2s,box-shadow .2s}
.case:active{transform:scale(.98)}
.case::after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,rgba(168,85,247,.35),transparent 70%)}
.case.hot{border-color:rgba(217,70,239,.7);box-shadow:0 0 24px rgba(217,70,239,.18)}
.tag{font-size:11px;letter-spacing:2px;color:var(--mut);text-transform:uppercase;display:flex;justify-content:space-between}
.case h2{margin:10px 0 2px;font-size:26px}
.case p{margin:0 0 14px;color:var(--mut);font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between}
.price{font-size:28px;font-weight:800}
.price small{font-size:14px;color:var(--gold);margin-left:4px}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,var(--p),var(--p2));box-shadow:0 6px 22px rgba(168,85,247,.45)}
.btn.ghost{background:#2a1f3f;box-shadow:none;color:var(--txt)}
.emoji{font-size:44px;position:absolute;right:18px;top:16px;z-index:1;filter:drop-shadow(0 0 14px rgba(168,85,247,.8))}

.top-list{display:grid;gap:10px}
.t{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:14px}
.t .n{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:800;background:#241540}
.t:nth-child(1) .n{background:linear-gradient(135deg,#ffd166,#f59e0b);color:#2a1a00}
.t:nth-child(2) .n{background:linear-gradient(135deg,#e5e7eb,#9ca3af);color:#111}
.t:nth-child(3) .n{background:linear-gradient(135deg,#f59e6b,#b45309);color:#1c0b00}
.t .nm{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t .sm{font-weight:800;color:var(--gold)}
.empty{color:var(--mut);text-align:center;padding:40px 10px}

.prof{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);
  border-radius:24px;padding:22px;text-align:center}
.ava{width:84px;height:84px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;
  font-size:34px;font-weight:800;background:linear-gradient(135deg,var(--p),var(--p2));
  box-shadow:0 0 30px rgba(168,85,247,.6);overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.big{font-size:44px;font-weight:900;color:var(--gold);margin:6px 0}
.mut{color:var(--mut)}
.btns{display:grid;gap:10px;margin-top:16px}

nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;
  padding:10px 10px calc(10px + env(safe-area-inset-bottom));
  background:rgba(10,5,22,.92);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav button{background:none;border:0;color:var(--mut);display:grid;gap:4px;justify-items:center;
  font-size:12px;font-weight:600;padding:6px 18px;border-radius:14px;cursor:pointer}
nav button i{font-style:normal;font-size:22px}
nav button.on{color:#fff;background:#241540;box-shadow:0 0 18px rgba(168,85,247,.35)}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:.2s;z-index:5}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#0f0720;border-top:1px solid var(--line);
  border-radius:26px 26px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .25s ease;max-height:86vh;overflow:auto}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:9px;background:#3a2a62;margin:0 auto 14px}
.prize{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #20143a}
.prize:last-child{border:0}
.prize .e{font-size:26px;width:36px;text-align:center}
.prize .l{flex:1}
.prize .c{font-weight:700;color:var(--p2)}
.view{display:none;animation:in .25s ease}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="top">
  <div class="brand"><div class="logo">XG</div><b>Xanreks Gold</b></div>
  <div class="bal" id="bal">💰 0</div>
</div>

<!-- КЕЙСЫ -->
<section class="view on" id="v-cases">
  <h1>Выбери свой<br><span>кейс.</span></h1>
  <div class="grid" id="cases"></div>
</section>

<!-- ТОП -->
<section class="view" id="v-top">
  <h1>Топ по<br><span>кейсам.</span></h1>
  <div class="top-list" id="toplist"></div>
</section>

<!-- ПРОФИЛЬ -->
<section class="view" id="v-prof">
  <h1>Твой<br><span>профиль.</span></h1>
  <div class="prof">
    <div class="ava" id="ava">?</div>
    <div style="font-size:22px;font-weight:800" id="uname">Игрок</div>
    <div class="mut" id="uid"></div>
    <div class="big" id="gold">0</div>
    <div class="mut">голды на балансе</div>
    <div class="btns">
      <button class="btn" onclick="toBot('')">Пополнить / вывести в боте</button>
      <button class="btn ghost" onclick="toBot('')">Задания и промокоды</button>
    </div>
  </div>
</section>

<nav>
  <button class="on" data-v="cases"><i>🎁</i>Кейсы</button>
  <button data-v="top"><i>🏆</i>Топ</button>
  <button data-v="prof"><i>👤</i>Профиль</button>
</nav>

<div class="sheet-bg" id="bg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div id="sheetBody"></div>
</div>

<script>
// ВПИШИ username своего бота без @ (например XanreksGoldBot). Если пусто — кнопка просто закроет приложение.
const BOT_USERNAME = "";

const tg = window.Telegram && Telegram.WebApp;
if (tg){ tg.ready(); tg.expand(); try{tg.setHeaderColor("#07030f");tg.setBackgroundColor("#07030f")}catch(e){} }

const CASES = [
 {k:"mogg",name:"Mogg",icon:"📦",price:20,desc:"Для старта",
  prizes:[["💎",5,"50 голды"],["🕳",60,"ничего"],["🎁",30,"25 голды"],["🪙",5,"70 голды"]]},
 {k:"xan",name:"Xan",icon:"📦",price:70,desc:"Золотая середина",hot:true,
  prizes:[["💎",10,"70 голды"],["🕳",50,"ничего"],["🎁",35,"30 голды"],["🪙",5,"150 голды"]]},
 {k:"legends",name:"Legends",icon:"👑",price:500,desc:"Для крупного выигрыша",
  prizes:[["💎",35,"120 голды"],["🏆",20,"240 голды"],["🪙",2,"867 голды"],["🕳",40,"ничего"],["🎃",15,"Хеллоуин кейс бесплатно"]]},
 {k:"halloween",name:"Хеллоуин",icon:"🎃",price:580,desc:"Сезонный кейс",
  prizes:[["👻",30,"150–300 голды"],["😈",35,"100 голды"],["🕳",50,"ничего"],["👺",1,"промокод 1200–3100 голды"]]}
];

const q = new URLSearchParams(location.search);
const goldNow = parseInt(q.get("g")||"0",10)||0;
let topData = [];
try{ topData = JSON.parse(q.get("top")||"[]"); }catch(e){}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// профиль из Telegram
const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
$("bal").textContent = "💰 " + goldNow;
$("gold").textContent = goldNow;
if (u){
  $("uname").textContent = [u.first_name,u.last_name].filter(Boolean).join(" ");
  $("uid").textContent = "ID " + u.id + (u.username ? " · @"+u.username : "");
  if (u.photo_url) $("ava").innerHTML = '<img src="'+esc(u.photo_url)+'">';
  else $("ava").textContent = (u.first_name||"?")[0].toUpperCase();
}

// кейсы
$("cases").innerHTML = CASES.map((c,i)=>`
  <div class="case ${c.hot?"hot":""}" onclick="openCase(${i})">
    <div class="tag"><span>0${i+1} / ${c.hot?"MOST POPULAR":"CASE"}</span><span></span></div>
    <div class="emoji">${c.icon}</div>
    <h2>${esc(c.name)}</h2><p>${esc(c.desc)}</p>
    <div class="row"><div class="price">${c.price}<small>голды</small></div>
    <button class="btn">Подробнее</button></div>
  </div>`).join("");

// топ
$("toplist").innerHTML = topData.length
  ? topData.map((t,i)=>`<div class="t"><div class="n">${i+1}</div><div class="nm">${esc(t[0])}</div><div class="sm">${esc(t[1])} 💰</div></div>`).join("")
  : '<div class="empty">Пока никто ничего не выбил</div>';

// навигация
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("on"));
  $("v-"+b.dataset.v).classList.add("on"); window.scrollTo(0,0);
  if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
});

// шторка кейса
function openCase(i){
  const c = CASES[i];
  const sum = c.prizes.reduce((a,p)=>a+p[1],0);
  const enough = goldNow >= c.price;
  $("sheetBody").innerHTML = `
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <div style="font-size:42px">${c.icon}</div>
      <div><div style="font-size:24px;font-weight:800">${esc(c.name)}</div>
      <div class="mut">Цена: ${c.price} голды · у тебя ${goldNow}</div></div>
    </div>
    <div style="margin:10px 0 4px;font-weight:700">Возможные призы</div>
    ${c.prizes.map(p=>`<div class="prize"><div class="e">${p[0]}</div><div class="l">${esc(p[2])}</div>
       <div class="c">${Math.round(p[1]/sum*100)}%</div></div>`).join("")}
    <div class="btns">
      <button class="btn" onclick="toBot('case_${c.k}')">🎰 Открыть в боте</button>
      ${enough?"":'<div class="mut" style="text-align:center;font-size:13px">Не хватает голды — пополни баланс в боте</div>'}
    </div>`;
  $("bg").classList.add("on"); $("sheet").classList.add("on");
  if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");
}
function closeSheet(){ $("bg").classList.remove("on"); $("sheet").classList.remove("on"); }

// переход в бота: открываем нужный кейс (или просто закрываем приложение)
function toBot(payload){
  if (tg && BOT_USERNAME && payload){
    tg.openTelegramLink("https://t.me/"+BOT_USERNAME+"?start="+payload); tg.close();
  } else if (tg){ tg.close(); }
}
</script>
</body>
</html>
